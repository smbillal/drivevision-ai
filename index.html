<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Real-Time Code & Error Solver</title>
    <!-- Tailwind CSS for modern dark developer terminal look -->
    <script src="https://tailwindcss.com"></script>
    <style>
        body { background-color: #030712; color: #f3f4f6; font-family: 'Fira Code', monospace, sans-serif; }
        .terminal-shadow { box-shadow: 0 0 40px rgba(16, 185, 129, 0.15); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Header Block -->
    <div class="w-full max-w-4xl text-center mb-6">
        <h1 class="text-3xl font-extrabold text-emerald-400 tracking-tight flex items-center justify-center gap-2">
            ⚡ AI Code Bug Fixer
        </h1>
        <p class="text-xs text-slate-500 mt-1">Instant real-time code optimization & error resolution engine</p>
    </div>

    <!-- Main Live Workspace Grid -->
    <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Input Panel -->
        <div class="bg-slate-950 border border-slate-900 rounded-2xl p-5 flex flex-col justify-between terminal-shadow">
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Paste Your Broken Code or Error Below:</label>
                <textarea id="inputCode" placeholder="// Paste JavaScript, Python, PHP, or HTML code here with any error messages..." 
                          class="w-full h-80 px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-slate-200 text-xs font-mono focus:outline-none focus:border-emerald-500 resize-none"></textarea>
            </div>
            <button id="solveBtn" onclick="analyzeAndFixCode()" 
                    class="w-full mt-4 py-3.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl text-xs uppercase tracking-wider transition-all">
                🛠️ Fix Code Instantly
            </button>
        </div>

        <!-- Output Panel -->
        <div class="bg-slate-950 border border-slate-900 rounded-2xl p-5 flex flex-col justify-between terminal-shadow">
            <div>
                <div class="flex justify-between items-center mb-3">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Optimized Output & Explanation:</label>
                    <span id="statusBadge" class="hidden px-2 py-0.5 bg-emerald-500/10 text-emerald-400 text-[9px] uppercase font-bold rounded-md border border-emerald-500/20">Fixed</span>
                </div>
                
                <!-- Output Display Screen -->
                <div class="w-full h-80 px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-slate-300 text-xs font-mono overflow-y-auto whitespace-pre-wrap relative">
                    <div id="loadingText" class="hidden text-slate-500 animate-pulse">🤖 AI is analyzing logic streams and compiling solutions...</div>
                    <code id="outputResult" class="text-emerald-300">Your resolved clean code and bug explanations will appear here...</code>
                </div>
            </div>

            <!-- Free Copy Action Hook (Viral Loop Engagement) -->
            <button id="copyBtn" onclick="copyFixedCode()" disabled
                    class="w-full mt-4 py-3.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 font-semibold rounded-xl text-xs uppercase tracking-wider transition-all">
                📋 Copy Solution Code
            </button>
        </div>
    </div>

    <!-- The Branding Footer (Viral Engine) -->
    <div class="mt-8 text-center bg-slate-950/40 backdrop-blur border border-slate-900 px-4 py-1.5 rounded-full">
        <p class="text-[10px] font-bold text-slate-600 tracking-widest uppercase">Powered by aibugfixer.com</p>
    </div>

    <!-- Application Engine Framework JavaScript -->
    <script>
        async function analyzeAndFixCode() {
            const rawCode = document.getElementById('inputCode').value.trim();
            const btn = document.getElementById('solveBtn');
            const outputBox = document.getElementById('outputResult');
            const loading = document.getElementById('loadingText');
            const badge = document.getElementById('statusBadge');
            const copyBtn = document.getElementById('copyBtn');

            if (!rawCode) {
                alert("Please paste some code or error message first!");
                return;
            }

            // 1. Initialize UI States
            btn.disabled = true;
            btn.innerText = "⏳ Compiling Logic Fixes...";
            outputBox.innerText = "";
            loading.classList.remove('hidden');
            badge.classList.add('hidden');
            copyBtn.disabled = true;

            // 2. Direct API Pipeline Connection Routing
            try {
                const systemicPrompt = `You are an expert software developer and cybersecurity debugger. Analyze the following broken code or error log. Provide the absolute correct fixed version of the code clearly enclosed inside code blocks, followed by a very short, crisp bulleted list explaining exactly what was wrong and how you fixed it.\n\nInput Code:\n${rawCode}`;

                const response = await fetch(
                    "https://huggingface.co",
                    {
                        headers: { "Content-Type": "application/json" },
                        method: "POST",
                        body: JSON.stringify({ 
                            inputs: systemicPrompt,
                            parameters: { max_new_tokens: 600, return_full_text: false, temperature: 0.2 }
                        }),
                    }
                );

                if (!response.ok) throw new Error("API Limit reached or endpoint latency issue.");

                const data = await response.json();
                let outputText = "";

                if (Array.isArray(data) && data[0]?.generated_text) {
                    outputText = data[0].generated_text;
                } else if (data.generated_text) {
                    outputText = data.generated_text;
                } else {
                    outputText = data;
                }

                // 3. Render Output To Screen Viewport
                loading.classList.add('hidden');
                outputBox.innerText = outputText.trim();
                badge.classList.remove('hidden');
                copyBtn.disabled = false;

            } catch (err) {
                loading.classList.add('hidden');
                outputBox.innerText = `Error: unable to reach AI pipeline right now. Double check the network stack or try again.`;
            } finally {
                btn.disabled = false;
                btn.innerText = "🛠️ Fix Code Instantly";
            }
        }

        // 4. Utility Copy Stream Function
        function copyFixedCode() {
            const outputText = document.getElementById('outputResult').innerText;
            navigator.clipboard.writeText(outputText);
            
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.innerText = "✅ Solution Copied!";
            setTimeout(() => {
                copyBtn.innerText = "📋 Copy Solution Code";
            }, 2000);
        }
    </script>
</body>
</html>
