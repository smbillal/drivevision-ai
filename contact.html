
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - AnySaver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold text-white">Any<span class="text-blue-500">Saver</span></a>
            <a href="index.html" class="text-xs bg-slate-700 px-3 py-1.5 rounded-lg">Home</a>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 py-12 flex-grow w-full">
        <h1 class="text-3xl font-extrabold mb-6 text-white text-center">Contact Us</h1>
        <form class="bg-slate-800 border border-slate-700 p-6 rounded-2xl space-y-4 text-xs">
            <div>
                <label class="block text-slate-300 mb-1">Your Name</label>
                <input type="text" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded text-white" placeholder="Enter name">
            </div>
            <div>
                <label class="block text-slate-300 mb-1">Your Email</label>
                <input type="email" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded text-white" placeholder="Enter email">
            </div>
            <div>
                <label class="block text-slate-300 mb-1">Message</label>
                <textarea rows="4" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded text-white" placeholder="Write message..."></textarea>
            </div>
            <button type="button" onclick="alert('Message Sent!')" class="w-full bg-blue-600 hover:bg-blue-500 py-2.5 rounded font-bold text-white">Send Message</button>
        </form>
    </main>

    <footer class="bg-slate-950 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 AnySaver ©SM Billal. All rights reserved.</p>
    </footer>
</body>
                  </html>
